name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type apply to authorize deployment"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: cartflow-terraform-apply
  cancel-in-progress: false

jobs:
  plan:
    name: Generate Terraform Plan
    if: github.ref == 'refs/heads/main' && inputs.confirm_apply == 'apply'
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: terraform-azure

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Record Terraform commit
        run: echo "${GITHUB_SHA}" > terraform-commit.txt

      - name: Generate saved plan
        run: terraform plan -input=false -out=tfplan

      - name: Show plan summary
        run: terraform show -no-color tfplan

      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: cartflow-terraform-plan
          path: |
            terraform-azure/tfplan
            terraform-azure/terraform-commit.txt
          retention-days: 1

  apply:
    name: Approve and Apply Terraform Plan
    needs: plan
    if: github.ref == 'refs/heads/main' && inputs.confirm_apply == 'apply'
    runs-on: ubuntu-latest
    environment: terraform-apply

    defaults:
      run:
        shell: bash
        working-directory: terraform-azure

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: cartflow-terraform-plan
          path: terraform-azure

      - name: Verify Terraform commit
        run: |
          test "$(cat terraform-commit.txt)" = "${GITHUB_SHA}" || {
            echo "Error: Terraform commit mismatch."
            exit 1
          }

      - name: Verify saved plan exists
        run: |
          test -s tfplan || {
            echo "Error: Saved Terraform plan is missing or empty."
            exit 1
          }

      - name: Apply saved plan
        run: terraform apply -input=false -auto-approve tfplan
