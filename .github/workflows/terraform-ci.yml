
name: Terraform CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "terraform-azure/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main
    paths:
      - "terraform-azure/**"
      - ".github/workflows/terraform-ci.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Format, Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: terraform-azure

    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_CLI: "false"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Initialize Terraform
        run: terraform init -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Create Terraform plan
        id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color 2>&1 | tee terraform-plan-output.txt

      - name: Add plan summary to workflow
        if: always()
        env:
          JOB_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Terraform Plan Summary"
            echo ""
            echo "- **Result:** ${JOB_RESULT}"
            echo "- **Branch:** ${GITHUB_REF_NAME}"
            echo "- **Commit:** ${GITHUB_SHA}"
            echo ""

            if [[ -f terraform-plan-output.txt ]]; then
              counts=$(grep -E '^Plan: [0-9]+ to add, [0-9]+ to change, [0-9]+ to destroy\.' terraform-plan-output.txt || true)

              if [[ -n "$counts" ]]; then
                echo "### Resource changes"
                echo ""
                echo '```text'
                echo "$counts"
                echo '```'
              elif grep -q 'No changes\.' terraform-plan-output.txt; then
                echo "**No infrastructure changes required.**"
              else
                echo "Plan counts are unavailable. Check the Terraform plan step logs."
              fi
            else
              echo "Terraform plan output was not generated."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
