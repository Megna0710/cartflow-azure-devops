
name: CartFlow Azure CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  AZURE_CONTAINER_REGISTRY: cartflowmegna2026.azurecr.io
  IMAGE_NAME: cartflow
  RESOURCE_GROUP: cartflow-rg
  CONTAINER_APP_NAME: cartflow-api

jobs:
  test:
    name: Test Python application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: pip install -r app/requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build-and-deploy:
    name: Build, Push and Deploy to Azure
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name cartflowmegna2026


      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$AZURE_CONTAINER_REGISTRY/$IMAGE_NAME:${{ github.sha }}"

      - name: Verify application health
        env:
          CONTAINER_APP_FQDN: ${{ vars.CARTFLOW_APP_FQDN }}
        run: |
          if [ -z "$CONTAINER_APP_FQDN" ]; then
            CONTAINER_APP_FQDN=$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)
          fi

          if [ -z "$CONTAINER_APP_FQDN" ] || [ "$CONTAINER_APP_FQDN" = "null" ]; then
            echo "Could not retrieve the Container App hostname."
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 10 --retry-delay 6 --retry-connrefused \
            "https://$CONTAINER_APP_FQDN/health"

